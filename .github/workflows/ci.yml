name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }} / numpy ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
        numpy: ["latest"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            numpy: "1.26"
          - os: ubuntu-latest
            python-version: "3.12"
            numpy: "latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          if [ "${{ matrix.numpy }}" != "latest" ]; then python -m pip install "numpy==${{ matrix.numpy }}.*"; fi
          python -c "import numpy, kac_zwanzig; print('numpy', numpy.__version__, '| kac_zwanzig', kac_zwanzig.__version__)"
      - name: Test
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests examples
